<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>نبض — Wrapped مهر</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FF7A1A}
a{color:#140A03}a:hover{color:#000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: {{accent}}; color: #140A03; font-family: Vazirmatn, system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 24px 32px; gap: 0; overflow: hidden">

  <div style="display: flex; gap: 4px">
    <div style="flex: 1; height: 3px; border-radius: 2px; background: #140A03"></div>
    <div style="flex: 1; height: 3px; border-radius: 2px; background: #140A03"></div>
    <div style="flex: 1; height: 3px; border-radius: 2px; background: rgba(20,10,3,0.25)"></div>
    <div style="flex: 1; height: 3px; border-radius: 2px; background: rgba(20,10,3,0.25)"></div>
    <div style="flex: 1; height: 3px; border-radius: 2px; background: rgba(20,10,3,0.25)"></div>
  </div>

  <div style="margin-top: 20px; font-size: 14px; font-weight: 700; opacity: 0.8">نبض · Wrapped</div>
  <div style="margin-top: 36px; font-size: 64px; font-weight: 900; line-height: 1.05; letter-spacing: -2px">مهرِ<br>تو</div>

  <div style="margin-top: 40px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid rgba(20,10,3,0.18); padding-bottom: 16px">
      <div style="font-size: 72px; font-weight: 900; line-height: 1">۱۸</div>
      <div style="font-size: 18px; font-weight: 700; line-height: 1.4">جلسه تمرین<br><span style="font-weight: 400; font-size: 14px">۴ تا بیشتر از شهریور</span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 36px; font-weight: 900">۱۴:۲۰</div>
        <div style="font-size: 13px">ساعت در حرکت</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 36px; font-weight: 900">۶٬۲۰۰</div>
        <div style="font-size: 13px">کیلوکالری</div>
      </div>
    </div>
  </div>

  <div style="margin-top: 28px; background: #140A03; color: #FFE7D4; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 13px; color: #FFB27A">ساعت طلایی‌ت</div>
    <div style="font-size: 30px; font-weight: 900">۱۸ تا ۲۰</div>
    <div style="font-size: 13px; line-height: 1.7">تو این ساعت‌ها بدنت بهترین حالشو داره: با ضربان کمتر، کار بیشتری کردی. جلسه‌های سنگین رو بذار برای همین موقع.</div>
  </div>

  <div style="margin-top: auto; display: flex; gap: 10px">
    <button type="button" style="flex: 1; height: 52px; border: none; border-radius: 16px; background: #140A03; color: #FFE7D4; font-family: Vazirmatn; font-size: 15px; font-weight: 700">بعدی</button>
    <button type="button" aria-label="اشتراک‌گذاری در استوری" style="width: 52px; height: 52px; border: 2px solid #140A03; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center; color: #140A03">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#4CC3FF","#C6F432","#B9A6FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF7A1A' };
  }
}
</script>
</body>
</html>
